<form class="composer" (ngSubmit)="submit()">
  <textarea
    name="message"
    rows="1"
    placeholder="Type your message…"
    [maxlength]="maxLength"
    [ngModel]="text()"
    (ngModelChange)="text.set($event)"
    (keydown)="onKeydown($event)"
    aria-label="Message"
  ></textarea>

  @if (isBotReplying()) {
    <button type="button" class="composer__button composer__button--stop" (click)="stop.emit()">
      Stop
    </button>
  } @else {
    <button type="submit" class="composer__button" [disabled]="!text().trim()">Send</button>
  }
</form>
