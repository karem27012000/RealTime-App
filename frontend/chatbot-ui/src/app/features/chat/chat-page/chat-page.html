<div class="layout">
  <app-conversation-list
    [conversations]="store.conversations()"
    [activeId]="store.activeConversationId()"
    (deleted)="store.deleteConversation($event)"
  />

  <main class="chat">
    <header class="chat__header">
      <h1>{{ store.activeConversation()?.title ?? 'New chat' }}</h1>
    </header>

    @if (store.error(); as error) {
      <div class="chat__error" role="alert">
        <span>{{ error }}</span>
        <button type="button" (click)="store.clearError()" aria-label="Dismiss">✕</button>
      </div>
    }

    <app-message-list
      [messages]="store.messages()"
      [streamingReply]="store.streamingReply()"
      [isLoading]="store.isLoading()"
    />

    <app-message-input
      [isBotReplying]="store.isBotReplying()"
      (send)="store.sendMessage($event)"
      (stop)="store.stopReply()"
    />
  </main>
</div>
